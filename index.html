<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191b19" />
    <meta
      name="description"
      content="Orbit — an independent directory for discovering open-source projects."
    />
    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml"
    />
    <link rel="alternate icon" href="/icons/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Orbit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Orbit — open source, in motion</title>
    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem('orbit:theme:v1')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        const storedLocale = localStorage.getItem('orbit:locale:v1')
        const browserLocales = navigator.languages || [navigator.language]
        const preferred = browserLocales.find((tag) => /^(zh|en)/i.test(String(tag)))
        const locale =
          storedLocale === 'zh' || storedLocale === 'en'
            ? storedLocale
            : String(preferred).toLowerCase().startsWith('zh')
              ? 'zh'
              : 'en'
        document.documentElement.dataset.theme = theme
        document.documentElement.lang = locale
      } catch {
        /* localStorage can be unavailable in private modes */
      }
    </script>
  </head>
  <body>
    <!--
      Static shell rendered before the bundle executes: the first paint shows the
      page structure and card placeholders instead of a blank screen. React
      clears this node when it mounts.
    -->
    <div id="root">
      <div class="boot-shell" id="boot-shell">
        <div class="feed-layout">
          <aside class="filter-rail" aria-hidden="true"></aside>
          <main class="feed-main">
            <div class="feed-list" aria-hidden="true">
              <div class="repo-card skeleton-card">
                <div class="skeleton skeleton-avatar"></div>
                <div class="skeleton-body">
                  <div class="skeleton skeleton-line w-30"></div>
                  <div class="skeleton skeleton-line w-70 tall"></div>
                  <div class="skeleton skeleton-line w-90"></div>
                  <div class="skeleton-chip-row">
                    <div class="skeleton skeleton-chip"></div>
                    <div class="skeleton skeleton-chip"></div>
                    <div class="skeleton skeleton-chip"></div>
                  </div>
                </div>
              </div>
              <div class="repo-card skeleton-card">
                <div class="skeleton skeleton-avatar"></div>
                <div class="skeleton-body">
                  <div class="skeleton skeleton-line w-30"></div>
                  <div class="skeleton skeleton-line w-70 tall"></div>
                  <div class="skeleton skeleton-line w-90"></div>
                  <div class="skeleton-chip-row">
                    <div class="skeleton skeleton-chip"></div>
                    <div class="skeleton skeleton-chip"></div>
                    <div class="skeleton skeleton-chip"></div>
                  </div>
                </div>
              </div>
              <div class="repo-card skeleton-card">
                <div class="skeleton skeleton-avatar"></div>
                <div class="skeleton-body">
                  <div class="skeleton skeleton-line w-30"></div>
                  <div class="skeleton skeleton-line w-70 tall"></div>
                  <div class="skeleton skeleton-line w-90"></div>
                  <div class="skeleton-chip-row">
                    <div class="skeleton skeleton-chip"></div>
                    <div class="skeleton skeleton-chip"></div>
                    <div class="skeleton skeleton-chip"></div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <noscript>Orbit needs JavaScript to render the feed.</noscript>
    <script>
      // The static shell mirrors the feed; drop it when the link points elsewhere.
      try {
        if (/^#\/(repo|user|u|saved|about)\b/.test(location.hash)) {
          document.getElementById('boot-shell')?.remove()
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
