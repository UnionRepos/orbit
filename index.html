<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191b19" />
    <meta
      name="description"
      content="Orbit — an independent directory for discovering open-source projects."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='12' fill='%232c6252'/%3E%3Cellipse cx='32' cy='32' rx='27' ry='13' fill='none' stroke='%232c6252' stroke-width='3' transform='rotate(-35 32 32)'/%3E%3C/svg%3E"
    />
    <title>Orbit — open source, in motion</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem('orbit:theme:v1')
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
      } catch {
        /* localStorage can be unavailable in private modes */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
