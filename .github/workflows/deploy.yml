name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys against the same Worker at once; queue instead of cancel
# so a deploy that is already uploading is always allowed to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PRODUCTION_URL: https://orbit.openhub.today

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    # Pin the image: ubuntu-latest migrates to Ubuntu 26 from 2026-10-19.
    runs-on: ubuntu-24.04
    # A manual dispatch can pick any ref; only ever ship main.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment:
      name: production
      url: https://orbit.openhub.today
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke test
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "${PRODUCTION_URL}/api/health" | tee /tmp/health.json | grep -q '"ok":true'; then
              echo "Health check passed: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "Attempt ${attempt} failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check never passed." >&2
          exit 1

      # Translation is served through an operator-supplied relay
      # (TRANSLATION_RELAY_URL/TOKEN Worker secrets on a verified Node host).
      # Until that infrastructure exists the probe warns instead of failing, so a
      # missing optional relay cannot turn every deploy red; set the repository
      # variable TRANSLATION_SMOKE=enabled to make it a hard release gate.
      - name: Smoke test translation provider
        env:
          TRANSLATION_SMOKE_STRICT: ${{ vars.TRANSLATION_SMOKE == 'enabled' && '1' || '0' }}
        run: node scripts/smoke-translation.ts
